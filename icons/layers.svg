<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-layers" role="img" aria-label="Merging"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-layers .l1{animation:ul-layers-up calc(2.8s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-layers .l2{animation:ul-layers-mid calc(2.8s / var(--ul-speed,1)) ease-in-out calc(-2.6999999999999997s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-layers .l3{animation:ul-layers-down calc(2.8s / var(--ul-speed,1)) ease-in-out calc(-2.5999999999999996s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-layers-up{0%,70%,100%{transform:translateY(0)}35%{transform:translateY(-2.6px)}}@keyframes ul-layers-mid{0%,70%,100%{transform:translateY(0)}35%{transform:translateY(-.9px)}}@keyframes ul-layers-down{0%,70%,100%{transform:translateY(0)}35%{transform:translateY(1.1px)}}</style><path class="l3" d="M3.5 16 12 20.5 20.5 16"/><path class="l2" d="M3.5 12 12 16.5 20.5 12"/><path class="l1" d="M12 3.5 20.5 8 12 12.5 3.5 8Z"/></svg>
