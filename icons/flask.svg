<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-flask" role="img" aria-label="Experimenting"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-flask .w{transform-origin:12px 14px;animation:ul-flask-sway calc(3.5999999999999996s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-flask .b1{transform-origin:11.1px 17.6px;animation:ul-flask-rise calc(2.4s / var(--ul-speed,1)) cubic-bezier(.45,0,.6,1) calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-flask .b2{transform-origin:12.9px 18.2px;animation:ul-flask-rise calc(2.4s / var(--ul-speed,1)) cubic-bezier(.45,0,.6,1) calc(-0.7999999999999999s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-flask .b3{transform-origin:12px 16.6px;animation:ul-flask-rise calc(2.4s / var(--ul-speed,1)) cubic-bezier(.45,0,.6,1) calc(-1.5999999999999999s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-flask-sway{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}@keyframes ul-flask-rise{0%{opacity:0;transform:translateY(0) scale(.5)}18%{opacity:1;transform:translateY(-2.4px) scale(1)}75%{opacity:.85}100%{opacity:0;transform:translateY(-13px) scale(.75)}}</style><path d="M9 3.5h6M10 3.5V9l-5 8.6a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3L14 9V3.5"/><path class="w" d="M8 14h8"/><circle class="b1" cx="11.1" cy="17.6" r="1" fill="currentColor" stroke="none"/><circle class="b2" cx="12.9" cy="18.2" r=".8" fill="currentColor" stroke="none"/><circle class="b3" cx="12" cy="16.