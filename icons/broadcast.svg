<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-broadcast" role="img" aria-label="Broadcasting"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-broadcast .d{animation:ul-broadcast-beat calc(2.2s / var(--ul-speed,1)) ease-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-broadcast .a1{animation:ul-broadcast-wave calc(2.2s / var(--ul-speed,1)) ease-in-out calc(-2.02s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-broadcast .a2{animation:ul-broadcast-wave calc(2.2s / var(--ul-speed,1)) ease-in-out calc(-1.7400000000000002s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-broadcast-beat{0%,30%,100%{transform:scale(1)}10%{transform:scale(.7)}}@keyframes ul-broadcast-wave{0%,60%,100%{opacity:.18}20%{opacity:1}}</style><circle class="d" cx="12" cy="12" r="1.75" fill="currentColor" stroke="none"/><path class="a1" d="M8.6 8.6a4.8 4.8 0 0 0 0 6.8M15.4 8.6a4.8 4.8 0 0 1 0 6.8"/><path class="a2" d="M5.8 5.8a8.8 8.8 0 0 0 0 12.4M18.2 5.8a8.8 8.8 0 0 1 0 12.4"/></svg>
