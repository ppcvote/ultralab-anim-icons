<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-morph" role="img" aria-label="Transforming"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-morph .sq{animation:ul-morph-sq calc(3s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-morph .ci{animation:ul-morph-ci calc(3s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-morph-sq{0%{opacity:1;transform:rotate(0) scale(1)}30%,50%{opacity:0;transform:rotate(45deg) scale(.8)}80%,100%{opacity:1;transform:rotate(90deg) scale(1)}}@keyframes ul-morph-ci{0%{opacity:0;transform:scale(.75)}30%,50%{opacity:1;transform:scale(1)}80%,100%{opacity:0;transform:scale(.75)}}</style><rect class="sq" x="6" y="6" width="12" height="12" rx="2"/><circle class="ci" cx="12" cy="12" r="7" opacity="0"/></svg>
