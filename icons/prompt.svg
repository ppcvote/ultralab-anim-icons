<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-prompt" role="img" aria-label="Awaiting input"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-prompt .ch{animation:ul-prompt-nudge calc(2.4s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-prompt .cu{animation:ul-prompt-blink calc(2.4s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-prompt-nudge{0%,30%,100%{transform:translateX(0)}12%{transform:translateX(1.2px)}}@keyframes ul-prompt-blink{0%,22%,50%,72%,100%{opacity:1}25%,47%,75%,97%{opacity:0}}</style><path class="ch" d="M5 7.5l4.5 4.5L5 16.5"/><path class="cu" d="M12.5 16.5h6.5"/></svg>
