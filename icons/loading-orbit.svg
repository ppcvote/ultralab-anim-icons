<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-loading-orbit" role="img" aria-label="Loading"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-loading-orbit .g{animation:ul-loading-orbit-spin calc(1.6s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-loading-orbit .a{animation:ul-loading-orbit-arc calc(2.8000000000000003s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-loading-orbit-spin{to{transform:rotate(360deg)}}@keyframes ul-loading-orbit-arc{from{stroke-dashoffset:55}to{stroke-dashoffset:-125}}</style><circle cx="12" cy="12" r="8" opacity=".18"/><g class="g"><path class="a" d="M12 4a8 8 0 1 1 0 16a8 8 0 1 1 0-16" pathLength="100" stroke-dasharray="85 95" stroke-dashoffset="55"/></g></svg>
