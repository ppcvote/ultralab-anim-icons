<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-hourglass" role="img" aria-label="Please wait"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-hourglass .g{animation:ul-hourglass-flip calc(4.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-hourglass .st{transform-origin:12px 7px;animation:ul-hourglass-top calc(4.2s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-hourglass .sb{transform-origin:12px 17px;animation:ul-hourglass-bot calc(4.2s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-hourglass .fl{animation:ul-hourglass-fall calc(4.2s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-hourglass-flip{0%,70%{transform:rotate(0)}90%,100%{transform:rotate(180deg)}}@keyframes ul-hourglass-top{0%{opacity:1;transform:translateY(0) scaleX(1)}64%{opacity:1;transform:translateY(2.6px) scaleX(.12)}66%,100%{opacity:0;transform:translateY(2.6px) scaleX(.12)}}@keyframes ul-hourglass-bot{0%{opacity:0;transform:translateY(1.2px) scaleX(0)}6%{opacity:1}64%,100%{opacity:1;transform:translateY(0) scaleX(1)}}@keyframes ul-hourglass-fall{0%{opacity:0;stroke-dashoffset:0}4%,60%{opacity:1}66%,100%{opacity:0;stroke-dashoffset:-6.44}}</style><g class="g"><path d="M6.5 3.5h11M6.5 20.5h11M8 3.5v1.8c0 2.6 1.8 4.2 4 6.7 2.2-2.5 4-4.1 4-6.7V3.5M8 20.5v-1.8c0-2.6 1.8-4.2 4-6.7 2.2 2.5 4 4.1 4 6.7v1.8"/><path class="st" d="M10.2 7h3.6" transform="matrix(.6 0 0 1 0 1)"/><path class="sb" d="M10.2 17h3.6" transform="matrix(.55 0 0 1 0 0)"/><path class="fl" d="M12 13v3.2" stroke-dasharray=".01 1.6"/></g></svg>
