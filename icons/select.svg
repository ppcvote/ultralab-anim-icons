<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-select" role="img" aria-label="Selecting text"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-select .h{transform-origin:4px 12px;animation:ul-select-h calc(3s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-select .e{animation:ul-select-e calc(3s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-select-h{0%,12%{opacity:.22;transform:scaleX(0)}45%,80%{opacity:.22;transform:scaleX(1)}92%{opacity:0;transform:scaleX(1)}100%{opacity:0;transform:scaleX(0)}}@keyframes ul-select-e{0%,12%{opacity:1;transform:translateX(-12px)}45%,80%{opacity:1;transform:translateX(0)}92%{opacity:0;transform:translateX(0)}100%{opacity:0;transform:translateX(-12px)}}</style><path d="M4 6.5h16M4 17.5h9" opacity=".45"/><rect class="h" x="4" y="9.6" width="12" height="4.8" rx="1" fill="currentColor" stroke="none" opacity=".22"/><path d="M4 12h12"/><path d="M4 9.2v5.6"/><path class="e" d="M16 9.2v5.6"/></svg>
