<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-wifi-search" role="img" aria-label="Searching for network"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-wifi-search .d{transform-origin:12px 17.5px;animation:ul-wifi-search-beat calc(2.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-wifi-search .a1{animation:ul-wifi-search-a1 calc(2.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-wifi-search .a2{animation:ul-wifi-search-a2 calc(2.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-wifi-search .a3{animation:ul-wifi-search-a3 calc(2.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-wifi-search-beat{0%,20%,100%{transform:scale(1)}8%{transform:scale(.7)}}@keyframes ul-wifi-search-a1{0%{opacity:.2}12%,78%{opacity:1}90%,100%{opacity:.2}}@keyframes ul-wifi-search-a2{0%,14%{opacity:.2}26%,78%{opacity:1}90%,100%{opacity:.2}}@keyframes ul-wifi-search-a3{0%,28%{opacity:.2}40%,78%{opacity:1}90%,100%{opacity:.2}}</style><circle class="d" cx="12" cy="17.5" r="1.25" fill="currentColor" stroke="none"/><path class="a1" d="M9.17 14.67a4 4 0 0 1 5.66 0"/><path class="a2" d="M6.34 11.84a8 8 0 0 1 11.32 0"/><path class="a3" d="M3.51 9.01a12 12 0 0 1 16.98 0"/></svg>
