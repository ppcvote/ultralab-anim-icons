<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-listen" role="img" aria-label="Listening"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-listen .g1{animation:ul-listen-lv calc(1.8s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-listen .g2{animation:ul-listen-lv calc(1.8s / var(--ul-speed,1)) ease-in-out calc(-1.62s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-listen .e{transform-origin:12px 11.5px;animation:ul-listen-echo calc(1.8s / var(--ul-speed,1)) ease-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-listen-lv{0%,55%,100%{opacity:.3}25%{opacity:1}}@keyframes ul-listen-echo{0%{opacity:0;transform:scale(1)}12%{opacity:.6}70%,100%{opacity:0;transform:scale(1.25)}}</style><rect x="9" y="3.5" width="6" height="10.5" rx="3"/><path class="g1" d="M11 10.5h2"/><path class="g2" d="M11 7.5h2"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5M9.5 20.5h5"/><path class="e" d="M5.5 11.5a6.5 6.5 0 0 0 13 0" opacity="0"/></svg>
