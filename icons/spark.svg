<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-spark" role="img" aria-label="Thinking"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-spark .s{animation:ul-spark-turn calc(3.2s / var(--ul-speed,1)) cubic-bezier(.65,0,.35,1) calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-spark .g{transform-origin:18.8px 4.4px;animation:ul-spark-glint calc(3.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-spark-turn{0%{transform:rotate(0) scale(1)}40%{transform:rotate(45deg) scale(.78)}80%,100%{transform:rotate(90deg) scale(1)}}@keyframes ul-spark-glint{0%,22%{opacity:0;transform:scale(.3)}42%{opacity:1;transform:scale(1)}70%,100%{opacity:0;transform:scale(.3)}}</style><path class="s" d="M12 4Q13 11 20 12Q13 13 12 20Q11 13 4 12Q11 11 12 4Z"/><path class="g" d="M18.8 2.6v3.6M17 4.4h3.6"/></svg>
