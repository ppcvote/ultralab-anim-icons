<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-connecting" role="img" aria-label="Connecting"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-connecting .o1{animation:ul-connecting-cw calc(3.6s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-connecting .o2{animation:ul-connecting-ccw calc(2.16s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-connecting-cw{to{transform:rotate(360deg)}}@keyframes ul-connecting-ccw{to{transform:rotate(-360deg)}}</style><circle cx="12" cy="12" r="8" opacity=".18"/><circle cx="12" cy="12" r="4.5" opacity=".18"/><circle cx="12" cy="12" r="1.25" fill="currentColor" stroke="none"/><g class="o1"><circle cx="12" cy="4" r="1.6" fill="currentColor" stroke="none"/></g><g class="o2"><circle cx="12" cy="16.5" r="1.25" fill="currentColor" stroke="none"/></g></svg>
