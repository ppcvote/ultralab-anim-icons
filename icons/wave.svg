<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-wave" role="img" aria-label="Spreading"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-wave .w1{animation:ul-wave-wave calc(2.6s / var(--ul-speed,1)) cubic-bezier(.2,.6,.35,1) calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-wave .w2{animation:ul-wave-wave calc(2.6s / var(--ul-speed,1)) cubic-bezier(.2,.6,.35,1) calc(-1.3s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-wave .d{animation:ul-wave-tap calc(1.3s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-wave-wave{0%{opacity:0;transform:scale(.18)}15%{opacity:1}100%{opacity:0;transform:scale(1)}}@keyframes ul-wave-tap{0%,30%,100%{transform:scale(1)}10%{transform:scale(.7)}}</style><circle class="d" cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle class="w1" cx="12" cy="12" r="8.5"/><circle class="w2" cx="12" cy="12" r="8.5" transform="scale(.55)"/></svg>
