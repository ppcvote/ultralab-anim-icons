<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-bot" role="img" aria-label="Assistant ready"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-bot .e{transform-origin:12px 13.4px;animation:ul-bot-blink calc(3.6s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-bot .a{animation:ul-bot-glow calc(1.8s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-bot .h{transform-origin:12px 19px;animation:ul-bot-tilt calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-bot-blink{0%,38%,44%,51%,100%{transform:scaleY(1)}41%,48%{transform:scaleY(.1)}}@keyframes ul-bot-glow{0%,100%{opacity:.35}50%{opacity:1}}@keyframes ul-bot-tilt{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-6deg)}80%{transform:rotate(3deg)}88%{transform:rotate(0)}}</style><g class="h"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 8V5.6M3.5 12.5v2.5M20.5 12.5v2.5"/><circle class="a" cx="12" cy="4.5" r="1.1" fill="currentColor" stroke="none"/><path class="e" d="M9.5 12.6v1.6M14.5 12.6v1.6"/></g></svg>
