<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-translate" role="img" aria-label="Translating"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-translate .p{animation:ul-translate-p calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-translate .q{animation:ul-translate-q calc(3.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-translate-p{0%,15%{transform:translate(0,0)}45%,65%{transform:translate(8px,8px)}95%,100%{transform:translate(0,0)}}@keyframes ul-translate-q{0%,15%{transform:translate(0,0)}45%,65%{transform:translate(-8px,-8px)}95%,100%{transform:translate(0,0)}}</style><g class="p"><rect x="3" y="3" width="10" height="10" rx="2.5"/><path d="M5.6 10.4 8 5.4l2.4 5M6.5 8.6h3"/></g><g class="q"><rect x="11" y="11" width="10" height="10" rx="2.5"/><path d="M13.5 14.5h5M13.5 17.5h3.5"/></g></svg>
