<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-notify" role="img" aria-label="New notification"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-notify .d{transform-origin:18px 6px;animation:ul-notify-pop calc(3s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-notify .r{transform-origin:18px 6px;animation:ul-notify-ring calc(3s / var(--ul-speed,1)) ease-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-notify .f{transform-origin:11.5px 12.5px;animation:ul-notify-buzz calc(3s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-notify-pop{0%{opacity:0;transform:scale(0)}10%{opacity:1;transform:scale(1.25)}18%,82%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(0)}}@keyframes ul-notify-ring{0%,10%{opacity:0;transform:scale(1)}12%{opacity:.7}45%,100%{opacity:0;transform:scale(2.1)}}@keyframes ul-notify-buzz{0%,10%,30%,100%{transform:rotate(0)}14%{transform:rotate(-5deg)}18%{transform:rotate(4deg)}22%{transform:rotate(-3deg)}26%{transform:rotate(2deg)}}</style><path class="f" d="M13 5H7.5A3.5 3.5 0 0 0 4 8.5v8A3.5 3.5 0 0 0 7.5 20h8a3.5 3.5 0 0 0 3.5-3.5V11M8 12h6M8 15.5h4"/><circle class="r" cx="18" cy="6" r="2.5" opacity="0"/><circle class="d" cx="18" cy="6" r="2.5" fill="currentColor" stroke="none"/></svg>
