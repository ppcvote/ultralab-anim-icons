<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-mail-send" role="img" aria-label="Sending"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-mail-send .m{animation:ul-mail-send-fly calc(2.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-mail-send .w{animation:ul-mail-send-wind calc(2.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-mail-send-fly{0%{opacity:0;transform:translateX(-5px)}12%,62%{opacity:1;transform:translateX(0)}70%{opacity:1;transform:translateX(-1px)}88%,100%{opacity:0;transform:translateX(9px)}}@keyframes ul-mail-send-wind{0%,66%{opacity:0;transform:translateX(0)}76%{opacity:.8}88%,100%{opacity:0;transform:translateX(4px)}}</style><g class="m"><rect x="3.5" y="6.5" width="17" height="11" rx="2"/><path d="m4.5 7.8 7.5 5.4 7.5-5.4"/></g><path class="w" d="M1.5 10.5h2.5M2.5 13.5h2" opacity="0"/></svg>
