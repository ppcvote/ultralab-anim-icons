<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-verify" role="img" aria-label="Verified"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-verify .h{animation:ul-verify-hex calc(3.4s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-verify .k{animation:ul-verify-tick calc(3.4s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-verify .g{animation:ul-verify-lift calc(3.4s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-verify-hex{0%{stroke-dashoffset:1.1;opacity:1}34%,86%{stroke-dashoffset:0;opacity:1}96%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1.1;opacity:0}}@keyframes ul-verify-tick{0%,34%{stroke-dashoffset:1.1;opacity:1}50%,86%{stroke-dashoffset:0;opacity:1}96%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1.1;opacity:0}}@keyframes ul-verify-lift{0%,50%,68%,100%{transform:scale(1)}58%{transform:scale(1.07)}}</style><path d="M12 3.5l7.4 4.25v8.5L12 20.5l-7.4-4.25v-8.5Z" opacity=".18"/><g class="g"><path class="h" d="M12 3.5l7.4 4.25v8.5L12 20.5l-7.4-4.25v-8.5Z" pathLength="1" stroke-dasharray="1 1.2"/><path class="k" d="M8.6 12.3l2.3 2.3 4.5-4.8" pathLength="1" stroke-dasharray="1 1.2"/></g></svg>
