<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-compass" role="img" aria-label="Locating"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-compass .n{animation:ul-compass-swing calc(3.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-compass-swing{0%{transform:rotate(0)}15%{transform:rotate(-35deg)}35%{transform:rotate(25deg)}50%{transform:rotate(-12deg)}62%{transform:rotate(6deg)}72%,100%{transform:rotate(0)}}</style><circle cx="12" cy="12" r="9"/><g class="n"><path d="M12 5.5l2.2 6.5H9.8Z" fill="currentColor"/><path d="M9.8 12 12 18.5l2.2-6.5"/></g><circle cx="12" cy="12" r=".9" fill="currentColor" stroke="none"/></svg>
