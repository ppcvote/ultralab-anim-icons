<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-radar" role="img" aria-label="Detecting"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-radar .s{animation:ul-radar-spin calc(2.4s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-radar .b{transform-origin:16.2px 7.8px;animation:ul-radar-blip calc(2.4s / var(--ul-speed,1)) linear calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-radar-spin{to{transform:rotate(360deg)}}@keyframes ul-radar-blip{0%,11%{opacity:0;transform:scale(.4)}14%{opacity:1;transform:scale(1.15)}22%{transform:scale(1)}70%,100%{opacity:0;transform:scale(1)}}</style><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5" opacity=".25"/><g class="s"><path d="M12 12V3.5"/><path d="M12 12V3.5" transform="rotate(-16)" opacity=".4"/><path d="M12 12V3.5" transform="rotate(-32)" opacity=".15"/></g><circle class="b" cx="16.2" cy="7.8" r="1.2" fill="currentColor" stroke="none"/></svg>
