<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-key" role="img" aria-label="Authorising"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-key .k{animation:ul-key-turn calc(3s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-key .m{animation:ul-key-push calc(3s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-key-turn{0%,25%{transform:scaleY(1)}33%,70%{transform:scaleY(-1)}78%,100%{transform:scaleY(1)}}@keyframes ul-key-push{0%,100%{transform:translateX(0)}18%,86%{transform:translateX(1.5px)}}</style><g class="m"><circle cx="7" cy="12" r="3.5"/><path d="M10.5 12h10"/><path class="k" d="M18 12v3M15 12v2"/></g></svg>
