<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-percent-ring" role="img" aria-label="Loading progress"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-percent-ring .a{animation:ul-percent-ring-fill calc(3.2s / var(--ul-speed,1)) cubic-bezier(.3,.1,.3,1) calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-percent-ring .c{animation:ul-percent-ring-dot calc(3.2s / var(--ul-speed,1)) cubic-bezier(.3,.1,.3,1) calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-percent-ring .g{animation:ul-percent-ring-lift calc(3.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-percent-ring-fill{0%{stroke-dashoffset:101;opacity:1}70%,82%{stroke-dashoffset:0;opacity:1}94%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:101;opacity:0}}@keyframes ul-percent-ring-dot{0%{opacity:1;transform:scale(0)}70%,82%{opacity:1;transform:scale(1)}94%{opacity:0;transform:scale(1)}100%{opacity:0;transform:scale(0)}}@keyframes ul-percent-ring-lift{0%,70%,82%,100%{transform:scale(1)}76%{transform:scale(1.06)}}</style><circle cx="12" cy="12" r="8.5" opacity=".18"/><g class="g"><path class="a" d="M12 3.5a8.5 8.5 0 1 1 0 17a8.5 8.5 0 1 1 0-17" pathLength="100" stroke-dasharray="100 110"/><circle class="c" cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></g></svg>
