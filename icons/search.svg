<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-search" role="img" aria-label="Searching"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-search .m{animation:ul-search-wander calc(3.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-search-wander{0%,100%{transform:translate(0,0)}25%{transform:translate(5px,-1.5px)}50%{transform:translate(3px,4px)}75%{transform:translate(-2px,2px)}}</style><path d="M3 6h18M3 12h18M3 18h12" opacity=".3"/><g class="m"><circle cx="10" cy="10" r="4.5"/><path d="M13.3 13.3 17 17"/></g></svg>
