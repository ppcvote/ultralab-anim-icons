<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-download" role="img" aria-label="Downloading"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-download .a{animation:ul-download-down calc(2.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-download .t{animation:ul-download-dip calc(2.2s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-download-down{0%{opacity:0;transform:translateY(-4px)}25%,60%{opacity:1;transform:translateY(0)}82%,100%{opacity:0;transform:translateY(3px)}}@keyframes ul-download-dip{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(1px)}}</style><path class="t" d="M4 15v2.5A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V15"/><g class="a"><path d="M12 4.5V15M7.5 10.5l4.5 4.5 4.5-4.5"/></g></svg>
