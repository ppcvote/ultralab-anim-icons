<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-scan" role="img" aria-label="Scanning"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-scan .l{animation:ul-scan-sweep calc(2.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-scan .t{animation:ul-scan-sweep calc(2.6s / var(--ul-speed,1)) ease-in-out calc(-2.46s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-scan .c{animation:ul-scan-focus calc(2.6s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-scan-sweep{0%,100%{transform:translateY(-5px)}50%{transform:translateY(5px)}}@keyframes ul-scan-focus{0%,50%,100%{transform:scale(1)}25%,75%{transform:scale(.95)}}</style><path class="c" d="M4 8.5V6a2 2 0 0 1 2-2h2.5M15.5 4H18a2 2 0 0 1 2 2v2.5M20 15.5V18a2 2 0 0 1-2 2h-2.5M8.5 20H6a2 2 0 0 1-2-2v-2.5"/><path class="t" d="M7.5 12h9" opacity=".3"/><path class="l" d="M7.5 12h9"/></svg>
