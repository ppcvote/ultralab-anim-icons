<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="ul-i ul-retry" role="img" aria-label="Error, retrying"><style>.ul-i{width:var(--ul-size,24px);height:var(--ul-size,24px);stroke-width:var(--ul-stroke,1.5);overflow:visible;vertical-align:middle;flex:none}.ul-i *{transform-box:view-box;transform-origin:12px 12px}@media (prefers-reduced-motion:reduce){.ul-i *{animation:none!important}}.ul-retry .x{animation:ul-retry-x calc(3.4s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}.ul-retry .r{animation:ul-retry-r calc(3.4s / var(--ul-speed,1)) ease-in-out calc(0s / var(--ul-speed,1)) infinite;animation-play-state:var(--ul-play,running)}@keyframes ul-retry-x{0%{opacity:1;transform:translateX(0)}6%{transform:translateX(-1px)}10%{transform:translateX(1px)}14%{transform:translateX(-.6px)}18%{transform:translateX(0)}34%{opacity:1}42%,90%{opacity:0;transform:translateX(0)}100%{opacity:1;transform:translateX(0)}}@keyframes ul-retry-r{0%,36%{opacity:0;transform:rotate(-90deg)}46%{opacity:1}80%{opacity:1;transform:rotate(270deg)}90%,100%{opacity:0;transform:rotate(270deg)}}</style><circle cx="12" cy="12" r="9"/><g class="x"><path d="M12 7.5v5"/><circle cx="12" cy="16" r="1" fill="currentColor" stroke="none"/></g><g class="r" opacity="0"><path d="M15.9 9.75A4.5 4.5 0 1 0 16.08 13.9M16.4 6.3v3.6h-3.6"/></g></svg>
